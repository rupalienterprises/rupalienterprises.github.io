<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Rupali Enterprises</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #172033;
    }

    .login-box {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.12);
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #667085;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 20px 0 12px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #error {
      color: #d92d20;
      margin-top: 15px;
    }

    #dashboard {
      display: none;
    }

    .header {
      background: #172033;
      color: white;
      padding: 20px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .container {
      width: min(1100px, 92%);
      margin: 40px auto;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 14px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    .logout {
      color: white;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,0.3);
      padding: 8px 14px;
      border-radius: 7px;
    }
  </style>
</head>

<body>

  <!-- PASSWORD SCREEN -->

  <div id="passwordScreen" class="login-box">

    <div class="box">

      <h1>Admin Portal</h1>

      <p>Enter the Admin password to continue.</p>

      <input
        type="password"
        id="password"
        placeholder="Admin password"
      >

      <button onclick="checkPassword()">
        Enter Admin Portal
      </button>

      <p id="error"></p>

      <p>
        <a href="index.html">← Back to website</a>
      </p>

    </div>

  </div>


  <!-- ADMIN DASHBOARD -->

  <div id="dashboard">

    <header class="header">

      <strong>Rupali Enterprises — Admin</strong>

      <a href="index.html" class="logout">
        Exit
      </a>

    </header>


    <main class="container">

      <h1>Admin Dashboard</h1>

      <p>Welcome to the Admin Portal.</p>


      <div class="card">

        <h2>Daily Sales</h2>

        <p>
          Sales entry and management will be added here.
        </p>

      </div>


      <div class="card">

        <h2>Associates</h2>

        <p>
          Associate management will be added here.
        </p>

      </div>

    </main>

  </div>


  <script>

    function checkPassword() {

      const password =
        document.getElementById("password").value;

      const error =
        document.getElementById("error");

      if (password === "Rupali@admin") {

        document.getElementById("passwordScreen").style.display = "none";

        document.getElementById("dashboard").style.display = "block";

      } else {

        error.textContent = "Incorrect password.";

      }

    }


    document
      .getElementById("password")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
          checkPassword();
        }

      });

  </script>

</body>
</html>
