<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin | Rupali Enterprises</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f8fb;
      color: #172033;
    }

    .header {
      background: #172033;
      color: white;
      padding: 22px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
    }

    .logout {
      color: white;
      text-decoration: none;
      padding: 9px 15px;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 7px;
    }

    .container {
      width: min(1100px, 92%);
      margin: 40px auto;
    }

    .eyebrow {
      color: #4f46e5;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    h1 {
      margin: 8px 0;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.06);
      margin-bottom: 25px;
    }

    .card h2 {
      margin-top: 0;
    }

    .coming {
      color: #667085;
      line-height: 1.6;
    }

    .button {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 20px;
      background: #4f46e5;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header class="header">

    <div class="logo">
      Rupali Enterprises
    </div>

    <a href="login.html" class="logout" onclick="logout()">
      Logout
    </a>

  </header>


  <main class="container">

    <p class="eyebrow">
      ADMIN PANEL
    </p>

    <h1>
      Welcome, Admin
    </h1>

    <p>
      Manage your associates and daily sales data.
    </p>


    <div class="card">

      <h2>
        Daily Sales
      </h2>

      <p class="coming">
        Add and manage daily sales data for your associates.
      </p>

      <a href="#" class="button">
        Add Sales Data
      </a>

    </div>


    <div class="card">

      <h2>
        Associates
      </h2>

      <p class="coming">
        View and manage your sales associates.
      </p>

    </div>

  </main>


  <script>

    function logout() {
      sessionStorage.removeItem("rupaliLogin");
    }

  </script>

</body>
</html>
